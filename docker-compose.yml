services:
  wnioski:
    build: .
    container_name: wnioski-urlopowe
    ports:
      - "8137:8000"
    environment:
      WNIOSKI_DATA_DIR: /srv/data
      WNIOSKI_ENV: prod
      # PostgreSQL (§23.1). Hasło z .env (patrz .env.example / ./setup.sh). Przy pierwszym starcie
      # backend automatycznie przeniesie dane z SQLite (plik SQLite zostaje jako backup).
      WNIOSKI_DB_URL: "postgresql+psycopg://wnioski:${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env (uruchom ./setup.sh)}@db:5432/wnioski"
      # Konto właściciela przy migracji starej bazy — ustaw znane hasło zamiast losowego z logów:
      # WNIOSKI_OWNER_PASSWORD: "twoje-haslo"
      # Logowanie Google (§18b) — Authorized redirect URI: http://localhost:8137/api/auth/google/callback
      # GOOGLE_CLIENT_ID: "..."
      # GOOGLE_CLIENT_SECRET: "..."
    volumes:
      - wnioski-dane:/srv/data
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQL (§23.1). UWAGA at-rest: wolumen bazy trzymaj na zaszyfrowanym nośniku (LUKS) —
  # Postgres sam nie szyfruje danych na dysku.
  db:
    image: postgres:16-alpine
    container_name: wnioski-postgres
    environment:
      POSTGRES_USER: wnioski
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env (uruchom ./setup.sh)}
      POSTGRES_DB: wnioski
    volumes:
      - wnioski-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wnioski -d wnioski"]
      interval: 5s
      timeout: 5s
      retries: 10
      # start_period: nieudane checki podczas initdb (pierwszy start / wolny sprzęt)
      # nie liczą się do retries. Hojnie, bo docelowy serwer bywa bardzo wolny.
      start_period: 120s
    restart: unless-stopped

volumes:
  wnioski-dane:   # dane aplikacji: SQLite (backup po migracji) + pliki PDF/załączniki
  wnioski-pg:     # dane PostgreSQL — trzymaj wolumen na zaszyfrowanym nośniku (LUKS)
