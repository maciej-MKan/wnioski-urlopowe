name: Deploy web demo (GitHub Pages)

# Buduje web-demo/ i publikuje na GitHub Pages.
# Wymaga: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [ main ]
    paths:
      - "web-demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-demo/package-lock.json
      - name: Install
        working-directory: web-demo
        run: npm ci
      - name: Build
        working-directory: web-demo
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
